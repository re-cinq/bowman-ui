name: Release

# Opens and maintains the release pull request from the Conventional Commits
# on main (release-please bumps package.json, writes CHANGELOG.md and drafts
# the notes) and, when that pull request merges, cuts the tag and the GitHub
# Release. Then it hands off twice, because everything this job creates it
# creates as GITHUB_TOKEN, and GitHub raises no workflow run for an event that
# token caused: the release pull request would never see CI, and the Release
# would never reach publish.yml. So this job dispatches ci.yml on the release
# branch (check runs attach to the head commit, which is all the required
# checks look at) and publish.yml on the new tag. No PAT and no GitHub App:
# workflow_dispatch is the one event GITHUB_TOKEN may raise, and publish.yml
# stays the workflow the npm trusted publisher is registered for.

on:
  push:
    branches: [main]

# Least privilege by default; the one job below opts into what it needs.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag and the GitHub Release
      pull-requests: write # the release pull request
      actions: write # the two workflow_dispatch hand-offs
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # release-please reports `pr` only on the run that creates or rewrites
      # the pull request. A push that changes no release content (a ci: or
      # chore: commit) leaves the open release pull request behind main, which
      # the branch rule refuses, and raises no event that would run CI on it.
      # So every run finds the open release pull request, updates its branch
      # when it is behind (the update is asynchronous, hence the wait), and
      # dispatches ci.yml on it. --repo because this job checks nothing out:
      # without a git directory gh cannot infer the repository.
      - name: Keep the release pull request current and checked
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 50 \
            --json number,headRefName,mergeStateStatus \
            --jq '[.[] | select(.headRefName | startswith("release-please--"))][0]')
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "no open release pull request"
            exit 0
          fi
          number=$(jq -r .number <<<"$pr")
          branch=$(jq -r .headRefName <<<"$pr")
          if [ "$(jq -r .mergeStateStatus <<<"$pr")" = "BEHIND" ]; then
            gh pr update-branch "$number" --repo "$GITHUB_REPOSITORY"
            for _ in $(seq 1 12); do
              sleep 5
              state=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json mergeStateStatus --jq .mergeStateStatus)
              [ "$state" != "BEHIND" ] && break
            done
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
      - name: Publish the release
        if: steps.rp.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
