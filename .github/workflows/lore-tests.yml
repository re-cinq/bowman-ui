# Deviations from the onboarding template, kept on regeneration (issue 137):
# push runs on main only (pull_request already covers every branch); the fetch
# step checks for LORE_INGEST_URL in its script (a fork's pull request carries
# no secrets, and `secrets` cannot be read from an `if:`); the binary is checked
# against LORE_CODE_TRACE_SHA256 below instead of the checksums.txt served
# beside it. A missing URL, a failed download or a mismatch never runs the
# binary, and a failed run or ingest is reported the same way: each annotates
# a pull request without failing it and fails on main. To bump the pin,
# download both /dist/lore-code-trace/linux-amd64 and
# /dist/lore-code-trace/checksums.txt from the ingest origin, confirm
# `sha256sum -c checksums.txt` agrees with an independent download, then paste
# the linux-amd64 digest.
# The report is posted by the binary itself (`--post`), not by a curl step of
# our own. The `POST /api/webhook/ci-tests` ingress such a step would target,
# on the LORE_WEBHOOK_URL host, is gone: that host now answers /api/webhook/*
# with a GitHub-deliveries route which authenticates by HMAC and ignores
# Authorization, so the post came back 401 `missing x-hub-signature-256
# header` whatever token it carried. The live sink is lore-api's incremental
# handshake, a GET of the repo's ingest-state followed by a POST of the delta
# the diff selects, and the binary is its only client. Hand-rolling it here is
# not an option: lore-api caps a JSON body at 1 MiB and this suite's full
# report is ~8 MB on the wire, so it has to ride the binary's {seq,total}
# chunk envelope - the binary packs per test descriptor under a 900 KB budget,
# and the delta is selected from `git diff --name-status
# <ingested commit>..HEAD`, which needs the work tree.
# Issue 166: --post therefore runs in the same job as the repository's own test
# commands, so the token is bound on push to main only - code that reaches main
# has been reviewed, a fork's pull request carries no secrets at all, and a
# same-repo pull request author already has write access. A pull request runs
# the binary with no token, no endpoint and no --post: it still proves the
# manifest and the test-command scripts work, and its report is uploaded as an
# artifact instead of posted. Posting one would in fact corrupt the graph - a
# pull_request checkout is detached, so the report names branch "HEAD", which
# lore-api reads as "not a branch" and projects into main's graph, advancing
# main's ingested-commit pointer to a merge ref that exists nowhere.
# What the single job costs: LORE_INGEST_TOKEN is lore-api's legacy token, which
# resolves to every scope - admin included - with no database lookup, and the
# binary runs each test command through `sh -c` with its own environment
# inherited. So on a push that credential is readable by the build and by all
# of the per-file runs, which means by the dependency tree at RUN time, where
# `npm ci --ignore-scripts` does not reach. A repo-scoped token carrying
# read+write would close that: the ingest route asks for write alone.
# The node install asks for the build (`build: "true"`, as ci.yml's consumer and
# rsc jobs do) so dist/ exists before the binary starts. The binary runs the
# manifest's `run` command over four files at a time and that command builds
# when dist is missing or stale; building here means it never has to, so no
# invocation's `rm -rf dist` can land under a sibling's test run.
# Issue 216: the template's Playwright install step is dropped. The binary
# honours only the manifest's first entry, the vitest suite, so the consumer
# entry never runs here, and its own run installs Chromium and WebKit itself
# anyway; the root `npx playwright install` it ran also resolved the latest
# playwright from the registry against no pin, the rule ci.yml's consumer job
# already records.
name: Lore Test Report

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref, as ci.yml records. On main it also serialises the
# ingest, so two quick merges cannot diff the same ingest-state and redden
# whichever loses the CAS. `cancel-in-progress: false` protects the RUNNING
# run only - GitHub keeps one pending run per group, so an intermediate main
# commit's report can still be dropped (lore-ingest.yml records the same rule)
# - but a pending run has started no chunk sequence, so none is abandoned.
concurrency:
  group: lore-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lore-tests-vitest:
    runs-on: ubuntu-latest
    # The bound on LORE_TRACE_TIMEOUT_MS below: 73 test files at four at a time
    # could otherwise stall for hours against GitHub's 360-minute default, and
    # on main a stalled run holds the concurrency group for all of it. The job
    # measures ~3 minutes today; the first push after this lands also posts a
    # full nine-chunk ingest, so the headroom is for that, not for the suite.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The delta is diffed from the commit Lore last ingested, which a
          # shallow clone cannot reach - every push would post a full report.
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch lore-code-trace
        id: fetch
        shell: bash
        env:
          LORE_INGEST_URL: ${{ secrets.LORE_INGEST_URL || vars.LORE_INGEST_URL }}
          LORE_CODE_TRACE_SHA256: a278a3e7fb556f4c5342a0d91fb3d3078e161ab529229ea85b686a9b0ccd07c1
        run: |
          if [ -z "${LORE_INGEST_URL}" ]; then
            echo "::warning::LORE_INGEST_URL is not configured - Lore test ingest skipped"
            [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && exit 0
            exit 1
          fi
          if ! curl -fsSL "${LORE_INGEST_URL}/dist/lore-code-trace/linux-amd64" -o lore-code-trace; then
            echo "::warning::lore-code-trace could not be downloaded - Lore test ingest skipped"
            [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && exit 0
            exit 1
          fi
          ACTUAL_SHA256=$(sha256sum lore-code-trace | cut -d " " -f 1)
          if [ "${ACTUAL_SHA256}" != "${LORE_CODE_TRACE_SHA256}" ]; then
            echo "::error::lore-code-trace sha256 ${ACTUAL_SHA256} does not match the pinned LORE_CODE_TRACE_SHA256 - Lore test ingest skipped; verify the new binary and bump the pin"
            [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && exit 0
            exit 1
          fi
          chmod +x lore-code-trace
          echo "fetched=true" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-node-install
        if: steps.fetch.outputs.fetched == 'true'
        with:
          build: "true"

      - name: Run test suite
        id: run
        if: steps.fetch.outputs.fetched == 'true'
        shell: bash
        env:
          LORE_API_URL: ${{ github.event_name == 'push' && (secrets.LORE_INGEST_URL || vars.LORE_INGEST_URL) || '' }}
          LORE_INGEST_TOKEN: ${{ github.event_name == 'push' && secrets.LORE_INGEST_TOKEN || '' }}
          # The binary's per-command default is 120s, which a cold runner can
          # exceed on the list command or a per-file run - and under
          # coverage_format lcov a timed-out run is reported as a FAILING
          # test, not as an error, so ten minutes buys the slack.
          LORE_TRACE_TIMEOUT_MS: "600000"
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            if [ -z "${LORE_API_URL}" ] || [ -z "${LORE_INGEST_TOKEN}" ]; then
              echo "::error::LORE_API_URL or LORE_INGEST_TOKEN is not configured - Lore test ingest skipped"
              exit 1
            fi
            if ! ./lore-code-trace --post; then
              echo "::error::Lore test run or ingest failed - see the binary's output above"
              exit 1
            fi
            exit 0
          fi
          if ! ./lore-code-trace > lore-test-report.json; then
            echo "::warning::Lore test run failed - reporting the run it produced"
          fi
          if [ -s lore-test-report.json ]; then
            echo "report=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload test report
        if: always() && steps.run.outputs.report == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lore-test-report
          path: lore-test-report.json
          retention-days: 1
          overwrite: true
