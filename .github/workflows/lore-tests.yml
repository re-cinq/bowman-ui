# Deviations from the onboarding template, kept on regeneration (issue 137):
# push runs on main only (pull_request already covers every branch); the fetch
# step checks for LORE_INGEST_URL in its script (a fork's pull request carries
# no secrets, and `secrets` cannot be read from an `if:`); the binary is checked
# against LORE_CODE_TRACE_SHA256 below instead of the checksums.txt served
# beside it. A missing URL, a failed download or a mismatch never runs the
# binary, and a failed run or ingest is reported the same way: each annotates
# a pull request without failing it and fails on main. To bump the pin,
# download both /dist/lore-code-trace/linux-amd64 and
# /dist/lore-code-trace/checksums.txt from the ingest origin, confirm
# `sha256sum -c checksums.txt` agrees with an independent download, then paste
# the linux-amd64 digest.
# Issue 166: the template's single `lore-code-trace --post` step ran the pull
# request's own test code with LORE_INGEST_TOKEN in its environment. Here the
# binary runs without --post and prints the report, which reaches a second job
# as an artifact; only that job, which checks out nothing and runs no
# repository code, holds the token and posts the report to the ci-tests
# ingress itself, in one request. The artifact is the one input a pull request
# still controls, so the post accepts exactly one JSON object. A same-repo
# pull request edits this file too, so the guard test pins the shape against
# drift, not against a write-access author.
# Issue 216: the template's Playwright install step is dropped. The binary
# honours only the manifest's first entry, the vitest suite, so the consumer
# entry never runs here, and its own run installs Chromium and WebKit itself
# anyway; the root `npx playwright install` it ran also resolved the latest
# playwright from the registry against no pin, the rule ci.yml's consumer job
# already records.
name: Lore Test Report

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lore-tests-vitest:
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.run.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch lore-code-trace
        id: fetch
        shell: bash
        env:
          LORE_INGEST_URL: ${{ secrets.LORE_INGEST_URL || vars.LORE_INGEST_URL }}
          LORE_CODE_TRACE_SHA256: 239ebb7ddc7bccbfd4cae1f9a3c5be272a808ab9eecb62cc3c10880391597468
        run: |
          if [ -z "${LORE_INGEST_URL}" ]; then
            echo "::warning::LORE_INGEST_URL is not configured - Lore test ingest skipped"
            [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && exit 0
            exit 1
          fi
          if ! curl -fsSL "${LORE_INGEST_URL}/dist/lore-code-trace/linux-amd64" -o lore-code-trace; then
            echo "::warning::lore-code-trace could not be downloaded - Lore test ingest skipped"
            [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && exit 0
            exit 1
          fi
          ACTUAL_SHA256=$(sha256sum lore-code-trace | cut -d " " -f 1)
          if [ "${ACTUAL_SHA256}" != "${LORE_CODE_TRACE_SHA256}" ]; then
            echo "::error::lore-code-trace sha256 ${ACTUAL_SHA256} does not match the pinned LORE_CODE_TRACE_SHA256 - Lore test ingest skipped; verify the new binary and bump the pin"
            [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && exit 0
            exit 1
          fi
          chmod +x lore-code-trace
          echo "fetched=true" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-node-install
        if: steps.fetch.outputs.fetched == 'true'

      - name: Run test suite
        id: run
        if: steps.fetch.outputs.fetched == 'true'
        shell: bash
        run: |
          if ! ./lore-code-trace > lore-test-report.json; then
            echo "::warning::Lore test run failed - reporting the run it produced"
            if [ -s lore-test-report.json ]; then
              echo "report=true" >> "$GITHUB_OUTPUT"
            fi
            [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && exit 0
            exit 1
          fi
          echo "report=true" >> "$GITHUB_OUTPUT"

      - name: Upload test report
        if: always() && steps.run.outputs.report == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lore-test-report
          path: lore-test-report.json
          retention-days: 1
          overwrite: true

  lore-tests-ingest:
    needs: lore-tests-vitest
    if: always() && needs.lore-tests-vitest.outputs.report == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lore-test-report

      - name: Post test report
        shell: bash
        env:
          LORE_WEBHOOK_URL: ${{ vars.LORE_WEBHOOK_URL }}
          LORE_INGEST_TOKEN: ${{ secrets.LORE_INGEST_TOKEN }}
        run: |
          if [ -z "${LORE_WEBHOOK_URL}" ] || [ -z "${LORE_INGEST_TOKEN}" ]; then
            echo "::warning::LORE_WEBHOOK_URL or LORE_INGEST_TOKEN is not configured - Lore test ingest skipped"
            [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && exit 0
            exit 1
          fi
          if ! jq --slurp --arg repo "${GITHUB_REPOSITORY}" \
            'if length == 1 and (.[0] | type) == "object" then .[0] + {repo: $repo} else error("expected one JSON object") end' \
            lore-test-report.json > lore-test-body.json; then
            echo "::warning::Lore test report is not one JSON object - Lore test ingest skipped"
            [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && exit 0
            exit 1
          fi
          AUTH_FILE=$(mktemp)
          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "${AUTH_FILE}" "${RESPONSE_FILE}"' EXIT
          printf 'Authorization: Bearer %s\n' "${LORE_INGEST_TOKEN}" > "${AUTH_FILE}"
          CURL_EXIT=0
          HTTP_STATUS=$(curl -s -o "${RESPONSE_FILE}" -w '%{http_code}' --retry 3 --max-time 120 -X POST \
            -H @"${AUTH_FILE}" -H "Content-Type: application/json" \
            --data-binary @lore-test-body.json \
            "${LORE_WEBHOOK_URL}/api/webhook/ci-tests") || CURL_EXIT=$?
          echo "Lore ci-tests ingress returned HTTP ${HTTP_STATUS:-000} (curl exit ${CURL_EXIT})"
          head -c 4096 "${RESPONSE_FILE}" | sed 's/^/| /'
          echo
          if [ "${CURL_EXIT}" = "3" ] || [ "${CURL_EXIT}" = "6" ]; then
            echo "::error::Lore test ingest could not reach ${LORE_WEBHOOK_URL} (curl exit ${CURL_EXIT}) - check LORE_WEBHOOK_URL"
          else
            case "${HTTP_STATUS}" in
              2??) exit 0 ;;
              5??|408|429|000|"") echo "::warning::Lore test ingest failed (HTTP ${HTTP_STATUS:-000}, transient)" ;;
              *) echo "::error::Lore test ingest rejected (HTTP ${HTTP_STATUS}) - check LORE_WEBHOOK_URL and LORE_INGEST_TOKEN" ;;
            esac
          fi
          [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && exit 0
          exit 1
