# lore-ingest-version: 3
# Pushes this repo's documentation into Lore. Adapted from the canonical
# onboarding template (same shape as re-cinq/Discovery's): push-triggered on the
# doc paths below, with a manual dispatch lever for full re-ingestion. The
# version marker above is what the Lore dashboard reads to mark this repo's
# ingest workflow aligned.
name: Lore Context Ingest

on:
  push:
    branches: [main]
    paths:
      - "CLAUDE.md"
      - "AGENTS.md"
      - "CONTRACT.md"
      - "README.md"
      - "adrs/**"
      - "specs/**"
      - ".specify/**"
  # Manual lever: a push-to-main can silently fail to dispatch. Dispatch
  # re-ingests on demand: an empty `files` input re-projects every tracked doc
  # path (full refresh); a JSON array re-ingests just those files.
  workflow_dispatch:
    inputs:
      files:
        description: "JSON array of files to ingest; empty = re-ingest all tracked doc paths"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Get changed files
        id: changes
        env:
          INPUT_FILES: ${{ github.event.inputs.files }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${INPUT_FILES}" ]; then
              FILES="${INPUT_FILES}"
            else
              # Full refresh: every tracked doc path in the tree (not a push
              # diff), so a manual run re-projects stale statuses regardless of
              # what the last commit touched.
              FILES=$(git ls-files -- \
                CLAUDE.md AGENTS.md CONTRACT.md README.md adrs specs .specify \
                | jq -R -s -c 'split("\n") | map(select(. != ""))')
            fi
          else
            FILES=$(git diff --name-only HEAD~1 HEAD | jq -R -s -c 'split("\n") | map(select(. != ""))')
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Submit to Lore ingest API
        if: steps.changes.outputs.files != '[]'
        env:
          LORE_INGEST_TOKEN: ${{ secrets.LORE_INGEST_TOKEN }}
          LORE_API_URL: ${{ vars.LORE_API_URL }}
          FILES: ${{ steps.changes.outputs.files }}
        run: |
          # Misconfiguration (unset URL) is a hard error - a missing var must
          # never silently fall back to a placeholder and report success.
          if [ -z "${LORE_API_URL}" ]; then
            echo "::error::LORE_API_URL repository variable is not set - context was NOT ingested"
            exit 1
          fi
          # Same class of misconfiguration: an unset token means every POST is
          # rejected with 401, which must never pass as a green run.
          if [ -z "${LORE_INGEST_TOKEN}" ]; then
            echo "::error::LORE_INGEST_TOKEN repository secret is not set - context was NOT ingested"
            exit 1
          fi
          # Capture the HTTP status instead of curl -f: a blanket warning once
          # masked a permanent 401 (unset token) as transient for the repo's
          # entire history. curl exits non-zero here only when no HTTP response
          # arrived, where -w prints 000.
          BODY_FILE="$(mktemp)"
          CURL_EXIT=0
          HTTP_STATUS=$(curl -s -o "${BODY_FILE}" -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${LORE_INGEST_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"files\": ${FILES},
              \"repo\": \"${{ github.repository }}\",
              \"commit\": \"${{ github.sha }}\"
            }" \
            "${LORE_API_URL}/api/ingest") || CURL_EXIT=$?
          echo "Lore ingest endpoint returned HTTP ${HTTP_STATUS:-000} (curl exit ${CURL_EXIT})"
          # Prefix each body line with '| ': the runner strips leading
          # whitespace before parsing ::workflow-commands::, so only a
          # non-whitespace prefix stops a response body from forging one. The
          # echo keeps the annotations below on a fresh line even when the
          # body has no trailing newline.
          sed 's/^/| /' "${BODY_FILE}"
          echo
          # A URL that cannot be parsed (exit 3) or resolved (exit 6) is a
          # misconfigured LORE_API_URL, not a transient blip - hard-fail like
          # the unset checks above.
          if [ "${CURL_EXIT}" = "3" ] || [ "${CURL_EXIT}" = "6" ]; then
            echo "::error::curl could not reach ${LORE_API_URL} (exit ${CURL_EXIT}) - context was NOT ingested"
            exit 1
          fi
          case "${HTTP_STATUS}" in
            2??)
              ;;
            5??|000|"")
              # Server-side or network trouble is plausibly transient - warn,
              # and rely on the next doc push (or a manual dispatch) to retry.
              echo "::warning::Lore ingest endpoint returned HTTP ${HTTP_STATUS:-000} (transient - next doc push retries)"
              ;;
            *)
              # Anything else (4xx auth/config, unexpected redirects) is
              # permanent - a retry will not fix it, so fail the run.
              echo "::error::Lore ingest endpoint returned HTTP ${HTTP_STATUS} - context was NOT ingested"
              exit 1
              ;;
          esac

  # Spec/ADR -> spec-traceability graph projection, restored from the
  # canonical template (this hand-adapted copy had dropped the job, so the
  # graph stayed permanently empty while chunks ingested fine). Each kind
  # projects independently via the matrix, with the same loud-failure
  # treatment as the ingest job: misconfiguration and 4xx fail the run,
  # only transient trouble warns.
  graph:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [specs, adrs]
    steps:
      - name: Project ${{ matrix.kind }} into the graph
        env:
          LORE_INGEST_TOKEN: ${{ secrets.LORE_INGEST_TOKEN }}
          LORE_API_URL: ${{ vars.LORE_API_URL }}
        run: |
          # Misconfiguration (unset URL) is a hard error - a missing var must
          # never silently fall back to a placeholder and report success.
          if [ -z "${LORE_API_URL}" ]; then
            echo "::error::LORE_API_URL repository variable is not set - ${{ matrix.kind }} were NOT projected"
            exit 1
          fi
          # Same class of misconfiguration: an unset token means every POST is
          # rejected with 401, which must never pass as a green run.
          if [ -z "${LORE_INGEST_TOKEN}" ]; then
            echo "::error::LORE_INGEST_TOKEN repository secret is not set - ${{ matrix.kind }} were NOT projected"
            exit 1
          fi
          BODY_FILE="$(mktemp)"
          CURL_EXIT=0
          HTTP_STATUS=$(curl -s -o "${BODY_FILE}" -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${LORE_INGEST_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"kinds\":[\"${{ matrix.kind }}\"],\"commit\":\"${{ github.sha }}\"}" \
            "${LORE_API_URL}/api/repos/${{ github.repository }}/ingest-graph") || CURL_EXIT=$?
          echo "Lore ingest-graph endpoint returned HTTP ${HTTP_STATUS:-000} (curl exit ${CURL_EXIT})"
          # Prefix each body line with '| ': the runner strips leading
          # whitespace before parsing ::workflow-commands::, so only a
          # non-whitespace prefix stops a response body from forging one. The
          # echo keeps the annotations below on a fresh line even when the
          # body has no trailing newline.
          sed 's/^/| /' "${BODY_FILE}"
          echo
          # A URL that cannot be parsed (exit 3) or resolved (exit 6) is a
          # misconfigured LORE_API_URL, not a transient blip - hard-fail like
          # the unset checks above.
          if [ "${CURL_EXIT}" = "3" ] || [ "${CURL_EXIT}" = "6" ]; then
            echo "::error::curl could not reach ${LORE_API_URL} (exit ${CURL_EXIT}) - ${{ matrix.kind }} were NOT projected"
            exit 1
          fi
          case "${HTTP_STATUS}" in
            2??)
              ;;
            5??|000|"")
              # Server-side or network trouble is plausibly transient - warn,
              # and rely on the next doc push (or a manual dispatch) to retry.
              echo "::warning::Lore ingest-graph endpoint returned HTTP ${HTTP_STATUS:-000} for ${{ matrix.kind }} (transient - next doc push retries)"
              ;;
            *)
              # Anything else (4xx auth/config, unexpected redirects) is
              # permanent - a retry will not fix it, so fail the run.
              echo "::error::Lore ingest-graph endpoint returned HTTP ${HTTP_STATUS} - ${{ matrix.kind }} were NOT projected"
              exit 1
              ;;
          esac
