# lore-ingest-version: 3
# Pushes this repo's documentation into Lore. Adapted from the canonical
# onboarding template (same shape as re-cinq/Discovery's): push-triggered on the
# doc paths below, with a manual dispatch lever for full re-ingestion. The
# version marker above is what the Lore dashboard reads to mark this repo's
# ingest workflow aligned.
name: Lore Context Ingest

on:
  push:
    branches: [main]
    paths:
      - "CLAUDE.md"
      - "AGENTS.md"
      - "CONTRACT.md"
      - "README.md"
      - "adrs/**"
      - "specs/**"
      - ".specify/**"
  # Manual lever: a push-to-main can silently fail to dispatch. Dispatch
  # re-ingests on demand: an empty `files` input re-projects every tracked doc
  # path (full refresh); a JSON array re-ingests just those files.
  workflow_dispatch:
    inputs:
      files:
        description: "JSON array of files to ingest; empty = re-ingest all tracked doc paths"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Get changed files
        id: changes
        env:
          INPUT_FILES: ${{ github.event.inputs.files }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${INPUT_FILES}" ]; then
              FILES="${INPUT_FILES}"
            else
              # Full refresh: every tracked doc path in the tree (not a push
              # diff), so a manual run re-projects stale statuses regardless of
              # what the last commit touched.
              FILES=$(git ls-files -- \
                CLAUDE.md AGENTS.md CONTRACT.md README.md adrs specs .specify \
                | jq -R -s -c 'split("\n") | map(select(. != ""))')
            fi
          else
            FILES=$(git diff --name-only HEAD~1 HEAD | jq -R -s -c 'split("\n") | map(select(. != ""))')
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Submit to Lore ingest API
        if: steps.changes.outputs.files != '[]'
        env:
          LORE_INGEST_TOKEN: ${{ secrets.LORE_INGEST_TOKEN }}
          LORE_API_URL: ${{ vars.LORE_API_URL }}
          FILES: ${{ steps.changes.outputs.files }}
        run: |
          # Misconfiguration (unset URL) is a hard error - a missing var must
          # never silently fall back to a placeholder and report success.
          if [ -z "${LORE_API_URL}" ]; then
            echo "::error::LORE_API_URL repository variable is not set - context was NOT ingested"
            exit 1
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer ${LORE_INGEST_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"files\": ${FILES},
              \"repo\": \"${{ github.repository }}\",
              \"commit\": \"${{ github.sha }}\"
            }" \
            "${LORE_API_URL}/api/ingest" \
            || echo "::warning::Lore ingest endpoint returned an error (transient - not blocking merge)"
