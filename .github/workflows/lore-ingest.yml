# lore-ingest-version: 5
name: Lore Context Ingest

on:
  push:
    branches: [main]
    paths:
      - "CLAUDE.md"
      - "AGENTS.md"
      - "adrs/**"
      - "runbooks/**"
      - "specs/**"
      - "teams/**"
      - ".specify/**"

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed files
        id: changes
        run: |
          # --no-renames: a moved file must arrive as its old path (a delete)
          # plus its new path, or the old path's chunks outlive the file.
          FILES=$(git diff --name-only --no-renames HEAD~1 HEAD | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "files=${FILES}" >> "$GITHUB_OUTPUT"

      - name: Notify Lore to ingest
        if: steps.changes.outputs.files != '[]'
        env:
          LORE_INGEST_TOKEN: ${{ secrets.LORE_INGEST_TOKEN }}
          LORE_INGEST_URL: ${{ secrets.LORE_INGEST_URL }}
          FILES: ${{ steps.changes.outputs.files }}
        run: |
          scripts/lore-post.sh "/api/ingest" \
            '{"files": '"${FILES}"', "repo": "${{ github.repository }}", "commit": "${{ github.sha }}"}' \
            "context was NOT ingested"

  graph:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [specs, adrs]
    steps:
      - name: Project ${{ matrix.kind }} into the graph
        env:
          LORE_INGEST_TOKEN: ${{ secrets.LORE_INGEST_TOKEN }}
          LORE_INGEST_URL: ${{ secrets.LORE_INGEST_URL }}
        run: |
          scripts/lore-post.sh "/api/repos/${{ github.repository }}/ingest-graph" \
            '{"kinds":["${{ matrix.kind }}"],"commit":"${{ github.sha }}"}' \
            "${{ matrix.kind }} were NOT projected"
