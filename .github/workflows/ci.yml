name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One in-flight run per ref. A stacked PR chain fans a single push out across
# every branch above it, and superseded runs were previously left to finish.
# main is exempt: its runs are the record of what actually landed, so they are
# never cancelled by a later push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: CI only builds and tests, never writes to the repo or the
# registry. id-token belongs to the publish workflow alone.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Lint (--max-warnings 0)
        run: npm run lint
      # Checked, never auto-committed: writing formatting back would need
      # contents: write, and this workflow's read-only token is worth more than
      # the convenience. A red check here is fixed with `npm run prettier`.
      - name: Format check
        run: npm run prettier:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test (coverage gate)
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Client directive check
        run: node scripts/check-client-directives.mjs
      # The Lore test-command interface must not drift from the scripts it
      # wraps: the committed list command has to keep emitting a parseable
      # JSON array (issue 189).
      - name: Lore list command emits parseable JSON
        run: node scripts/lore-list-tests.mjs | jq -e 'type == "array" and length > 0' > /dev/null
      # CONTRACT.md decision 4: next is not a dependency anywhere. Prove it
      # against the installed tree, not just the manifest.
      - name: next must be absent
        run: |
          test ! -d node_modules/next
          ! grep -E '"next"[[:space:]]*:' package.json
