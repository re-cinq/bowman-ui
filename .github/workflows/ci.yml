name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only builds and tests, never writes to the repo or the
# registry. id-token belongs to the publish workflow alone.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Lint (--max-warnings 0)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test (coverage gate)
        run: npm run test:coverage
      - name: Build
        run: npm run build
