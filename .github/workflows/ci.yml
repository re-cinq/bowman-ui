name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One in-flight run per ref. A stacked PR chain fans a single push out across
# every branch above it, and superseded runs were previously left to finish.
# main is exempt: its runs are the record of what actually landed, so they are
# never cancelled by a later push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: CI only builds and tests, never writes to the repo or the
# registry. id-token belongs to the publish workflow alone.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The spec anchor check resolves origin/main content; the repo is
          # private, so a later unauthenticated fetch cannot bring it in.
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-install
      - name: Lint (--max-warnings 0)
        run: npm run lint
      # Checked, never auto-committed: writing formatting back would need
      # contents: write, and this workflow's read-only token is worth more than
      # the convenience. A red check here is fixed with `npm run prettier`.
      - name: Format check
        run: npm run prettier:check
      - name: Typecheck
        run: npm run typecheck
      # test:coverage runs the build itself, so dist/ is fresh for the
      # directive check without a second build step.
      - name: Test (coverage gate)
        run: npm run test:coverage
      - name: Client directive check
        run: node scripts/check-client-directives.mjs
      # Issue 82: the tree-wide static import ban (auth SDK, data-fetching,
      # i18n, meta-framework, internal source-app packages, path aliases).
      # The dynamic node_modules scan lives in scripts/consumer-app.sh.
      - name: Forbidden import check
        run: node scripts/check-forbidden-imports.mjs
      # Issue 213: the source-invariant markdown-safety gate. Fails the PR when
      # the one refactor that would void the whole XSS corpus lands - rehype-raw
      # added, skipHtml re-enabled, allowImages default flipped, or a dangerous
      # scheme (javascript/data/vbscript/file) admitted to the default allowlist.
      - name: Markdown safety check
        run: npm run check:markdown-safety
      # jscpd copy-paste gate over the whole tree (config in .jscpd.json): zero
      # clones at min-tokens 50. Ignored, all non-code: lockfiles, markdown
      # (jscpd double-counts fenced blocks and the spec header tables are
      # mandated), the verbatim lore mirrors under tools/, and tests/fixtures/**
      # (golden fixtures duplicate by design). A red check is fixed by
      # extracting a shared helper, never by raising the threshold
      # (docs/design-notes.md § Lint guardrails decision 12).
      - name: Duplication check
        run: npm run check:duplication
      # tools/eslint-plugin-lore/rules/** are verbatim mirrors of the generic
      # subset of re-cinq/lore's eslint plugin, and tools/lore-shared/**
      # verbatim mirrors of lore's spec domain library. This
      # byte-compares both against lore's main and fails when lore ships a rule
      # this repo has neither mirrored nor recorded as excluded. A red check is
      # fixed by
      # `npm run check:lore-plugin-sync -- --write` (drift) or by deciding the
      # new rule in scripts/check-lore-plugin-sync.mjs. Exit 2 is a fetch
      # failure, not drift.
      - name: Lore plugin sync check
        run: npm run check:lore-plugin-sync
      # Issue 97: the assistive-technology pass's structure gate. Validates the
      # newest docs/accessibility/at-pass-*.md when one exists - required
      # fields, a verdict per row per stack, no unexplained not-run, no fail
      # without an owner, no expired waiver. With no record yet it passes with
      # a warning: the first record is written by the first human screen-reader
      # pass, and pull requests must not be hostage to it. The release-blocking
      # half of the gate is --freshness in publish.yml.
      - name: AT-pass structure check
        run: npm run check:at-pass -- --structure
      # specs' [validated by](...#Lnn) anchors drift silently when any cited
      # repository file gains or loses lines (issues 36 and 37). Fails
      # when an anchor no longer points at the line content it cited on main; a
      # red check is fixed with
      # `node scripts/repoint-spec-anchors.mjs`.
      - name: Spec anchor check
        run: node scripts/repoint-spec-anchors.mjs --check origin/main
      # Issue 2, the other half of the anchor check above: a `[validated by]`
      # link counts as coverage only in its statement's TRAILING parenthetical,
      # so one written mid-statement is dropped upstream in silence and the spec
      # reads as cited while nothing is. A red check is fixed by moving the link
      # to the end of its statement, never by deleting it.
      - name: Spec link placement
        run: npm run check:spec-links
      # Every spec declares a lifecycle status in its header table that
      # must match its test-link coverage: none linked is Draft, some In
      # Progress, all Shipped. ADRs keep `accepted` and need only a lead
      # paragraph. Fix a red check in the status row or the missing lead
      # paragraph, never in the links; `check:spec-status -- --coverage`
      # lists unlinked statements and never gates.
      - name: Spec status
        run: npm run check:spec-status
      # The Lore test-command interface must not drift from the scripts it
      # wraps: the committed list command has to keep emitting a parseable
      # JSON array (issue 189).
      - name: Lore list command emits parseable JSON
        run: node scripts/lore-list-tests.mjs | jq -e 'type == "array" and length > 0' > /dev/null
      # docs/design-notes.md decision 4: next is no dependency of the published
      # package. Prove it against the installed tree, not just the manifest.
      # Both probes read the repo root only, so examples/rsc-fixture - the one
      # path where next may appear (§ RSC fixture) - is outside
      # their scope by construction; the exemption changes nothing here.
      - name: next must be absent
        run: |
          test ! -d node_modules/next
          ! grep -E '"next"[[:space:]]*:' package.json

  # Issue 82: the packed-tarball consumer proof. Builds the package, packs it,
  # installs the tarball into a temp copy of examples/chat-demo outside the
  # repo tree and runs the real-Chromium Playwright suite against vite
  # preview. No fetch-depth: 0 - this job runs no spec anchor check.
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-install
        with:
          build: "true"
      # OS-level browser dependencies for the runner; the script installs the
      # Chromium build matching the demo's pinned @playwright/test itself.
      - name: Install chromium
        run: npx playwright install --with-deps chromium
      - name: Consumer app check
        run: ./scripts/consumer-app.sh

  # Issue 100: the App Router client-boundary proof. Builds the package, packs
  # it, installs the tarball into a temp copy of examples/rsc-fixture outside
  # the repo tree and compiles it with next build against Turbopack, then
  # asserts a plain HTTP response from next start carries the rendered svg.
  # The --expect-failure step proves the guard goes red when a dist directive
  # is stripped. The three next-absence checks run here too, unmodified,
  # beside the one place next is allowed to appear.
  rsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-install
        with:
          build: "true"
      - name: RSC fixture check
        run: ./scripts/rsc-fixture.sh
      - name: RSC fixture check (--expect-failure)
        run: ./scripts/rsc-fixture.sh --expect-failure
      - name: Forbidden import check (unchanged, beside the fixture)
        run: node scripts/check-forbidden-imports.mjs
      - name: next must be absent (unchanged, beside the fixture)
        run: |
          test ! -d node_modules/next
          ! grep -E '"next"[[:space:]]*:' package.json
      # The consumer job's dynamic scan cannot run against the fixture's own
      # installed tree - that tree contains next by design. Running the same
      # find against this job's repo install proves the exemption stays
      # scoped to examples/rsc-fixture.
      - name: node_modules scan (unchanged, beside the fixture)
        run: ./scripts/scan-forbidden-node-modules.sh "$PWD/node_modules"
