name: Pages

# Publishes examples/chat-demo - the documentation at "/" (the landing) and the
# local-test chat fixture at "/?view=chat" - to GitHub Pages. The demo is
# English-only, so the published chat and every local run render the same
# catalogue.
#
# The demo is built the way scripts/consumer-app.sh builds it: the library is
# packed and the tarball installed by file path, never the registry, because
# examples/chat-demo/package.json deliberately declares no @re-cinq/bowman-ui
# dependency (the consumer check asserts that). --no-save keeps the checkout's
# manifest as committed.
#
# Two triggers, one build. A push to main that touches an input of the site
# (the library source, the demo, the manifests, this file) rebuilds and
# redeploys; a pull request touching the same inputs runs the build job only,
# so a broken site is a red check before it is a broken deployment. The path
# filters keep a docs-only or spec-only change from redeploying an identical
# site. Pages itself is a repository setting (source: GitHub Actions), not
# something this workflow can switch on.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "examples/chat-demo/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "THIRD-PARTY-NOTICES.md"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "src/**"
      - "examples/chat-demo/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "THIRD-PARTY-NOTICES.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# One deploy at a time on main, and never cancel one mid-flight: a
# half-finished Pages deployment is a broken site, not a superseded check.
# Keyed by ref so pull-request builds never queue behind a deployment.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

# Least privilege at the top: unlisted scopes are none for every job.
# pages/id-token write live on the deploy job alone.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # configure-pages calls GET /repos/{owner}/{repo}/pages, which needs the
    # Pages scope on the token - read suffices because enablement is not used.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      # Reads the repository's Pages settings and reports the path the site is
      # served from - "/bowman-ui" for a project site. Deriving it beats
      # hardcoding the repository name in the vite config. Skipped on pull
      # requests: a check must not depend on the repository's Pages state, so
      # those fall back to the project-site path derived from the repo name.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
        if: github.event_name != 'pull_request'
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build the library
        run: npm run build
      - name: Pack the library
        run: echo "tarball=$(npm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)" >> "$GITHUB_OUTPUT"
        id: pack
      - name: Install the demo's dependencies
        run: npm install --no-fund --no-audit
        working-directory: examples/chat-demo
      - name: Install the packed tarball by file path
        run: npm install --no-fund --no-audit --no-save "$RUNNER_TEMP/${{ steps.pack.outputs.tarball }}"
        working-directory: examples/chat-demo
      # VITE_BASE_PATH is read by examples/chat-demo/vite.config.ts, which adds
      # the trailing slash Vite wants. Unset - every local run and every check
      # in ci.yml - the demo is built for the root instead.
      - name: Build the demo for Pages
        run: npm run build
        working-directory: examples/chat-demo
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path || format('/{0}', github.event.repository.name) }}
      # The one thing a root-path build in ci.yml cannot prove: the base path
      # reached the bundle, so the site's assets resolve under the project
      # path instead of 404ing at the domain root.
      - name: Assets resolve under the project path
        run: grep -q "\"${BASE_PATH}/assets/" examples/chat-demo/dist/index.html
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path || format('/{0}', github.event.repository.name) }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: examples/chat-demo/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
