name: PR Description Check

on:
  pull_request:
    types: [opened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Issue 398: Dependabot writes its own body - release notes, commits,
  # compatibility - with none of these headings, so its pull requests could
  # never pass and sat unmerged. The author's login decides, not the actor's: a
  # person editing a Dependabot body does not bring the check back. GitHub
  # reports a job its `if:` skipped as a success, so a required check holds.
  check-description:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check required sections
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          missing=()
          printf '%s' "${PR_BODY}" | grep -qE '^## Why' || missing+=("## Why")
          printf '%s' "${PR_BODY}" | grep -qE '^## What Changed' || missing+=("## What Changed")
          printf '%s' "${PR_BODY}" | grep -qE '^## Testing' || missing+=("## Testing")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::PR description is missing required section(s): ${missing[*]}"
            echo "Add the missing heading(s) to the PR description and re-save."
            exit 1
          fi
          echo "All required sections present (## Why, ## What Changed, ## Testing)."
