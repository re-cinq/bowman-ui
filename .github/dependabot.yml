version: 2

# Every third-party action in this repo is pinned to a full commit SHA, which is
# the right call and also the reason this file exists: a SHA pin never drifts,
# so without an updater it silently ages into an unpatched snapshot. Dependabot
# rewrites the SHA and the trailing `# vX` comment together.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"

  # The composite action lives outside .github/workflows, which the "/" entry
  # alone does not scan; its setup-node pin ages like any other without this.
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/setup-node-install"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    # devDependencies never reach a consumer (`files: ["dist"]`), so the safe
    # ones move as one PR. Majors are excluded from the group deliberately: the
    # first batch this config produced carried five at once (eslint 9 -> 10,
    # jsdom 27 -> 30, jest-dom 6 -> 7, plugin-react 5 -> 6, @eslint/js 9 -> 10),
    # which is only reviewable by hand-running the full suite against the real
    # codebase - and a Dependabot PR's own green check cannot do that while it
    # targets a branch the components have not reached yet. Ungrouped majors
    # arrive one per PR, each bisectable and each revertible on its own.
    #
    # Runtime dependencies are never grouped: react-markdown and remark-gfm are
    # the only two, they render untrusted model output, and each deserves its
    # own review rather than a line in a batch.
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Peer range is a tested claim, not a floor (docs/design-notes.md decision 4).
      # Widening it is a deliberate act with a test matrix behind it.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # The dual TypeScript install is load-bearing: `typescript` (~6.x) feeds
      # the lint stack because typescript-eslint caps its peer range below 7,
      # while the `typescript7` alias is what build and typecheck invoke. A
      # major bump on either half breaks that split silently (README § Development).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript7"
        update-types: ["version-update:semver-major"]
