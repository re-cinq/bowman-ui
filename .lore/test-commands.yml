```yaml
- id: bowman-ui
  name: bowman-ui
  cwd: .
  list: |
    npm test -- --listTests --json 2>/dev/null | jq -r '.[]' | while read file; do
      node -e "
        const fs = require('fs');
        const content = fs.readFileSync('$file', 'utf8');
        const lines = content.split('\n');
        const tests = [];
        lines.forEach((line, idx) => {
          const match = line.match(/^\s*(it|test|describe)\s*\(\s*['\"]([^'\"]+)['\"]/);
          if (match) {
            tests.push({
              id: '$file::' + match[2].replace(/\s+/g, '_'),
              name: match[2],
              file: '$file',
              startLine: idx + 1,
              endLine: idx + 1
            });
          }
        });
        console.log(JSON.stringify(tests));
      "
    done | jq -s 'flatten'
  run: npm test -- --testNamePattern="{selector}" --coverage --coverageReporters=lcov 2>&1
  coverage_format: lcov
```