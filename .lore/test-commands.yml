```yaml
- id: bowman-ui
  name: bowman-ui
  cwd: .
  list: npm test -- --listTests --json 2>/dev/null | jq -r '.[]' | xargs -I {} sh -c 'grep -E "^\s*(describe|it|test)\(" "{}" | sed "s|^|{}:|" | jq -Rs "split(\"\\n\") | map(select(length > 0) | split(\":\") as [$file, $test] | {id: ($file + \":\" + ($test | gsub(\"^\\s+(describe|it|test)\\(\"; \"\") | gsub(\"[,;].*$\"; \"\"))), name: ($test | gsub(\"^\\s+(describe|it|test)\\(\"; \"\") | gsub(\"[,;].*$\"; \"\")), file: $file, startLine: 0, endLine: 0})"' 2>/dev/null || echo '[]'
  run: npm test -- --testNamePattern="{selector}" --coverage --coverageReporters=lcov 2>&1 | tee /tmp/test-output.txt && cat coverage/lcov.info | jq -Rs "split(\"\\n\") | map(select(startswith(\"SF:\")) | gsub(\"^SF:\"; \"\")) as $files | {passed: (if (\"PASSED\" | IN(inputs[])) then true else false end), covered: ($files | map({file: ., startLine: 0, endLine: 0}))}" || echo '{passed:false,covered:[]}'
  coverage_format: lcov
```