# Lore test-command interface (lore_list_tests / lore_run_test).
# Replaces the onboarding-generated draft, which was fenced markdown (invalid
# YAML) and used Jest flags this Vitest repo does not understand.
- id: bowman-ui-vitest
  name: bowman-ui Vitest suite
  cwd: .
  description: >-
    The jsdom unit/contract suite (Vitest 4, coverage-v8). Runs on every pull
    request in .github/workflows/ci.yml as the "Test (coverage gate)" step.
    The run command takes either shape of selector: a listed id,
    "<repo-relative-file>::<full test name>", which runs that one test and
    fails on anything but exactly one match; or a bare "<repo-relative-file>",
    which runs the file whole and is what lore-code-trace passes, since it
    groups the listed tests by file and runs this command once per file. Per
    the coverage_format contract the lcov goes to stdout and nothing else
    does - Vitest's summary is on stderr - and each invocation writes coverage
    to its own temp directory, because the binary runs four at a time. Both
    commands build dist first (several tests assert the built output, and one
    file cannot even collect without it), under a lock that builds once and
    lets the other three skip it rather than deleting dist from under each
    other. The run command zeroes the global coverage thresholds, since the
    committed floor is only meaningful for the whole suite.
  list: node scripts/lore-list-tests.mjs
  run: node scripts/lore-run-test.mjs "{selector}"
  coverage_format: lcov
- id: bowman-ui-consumer
  name: bowman-ui browser consumer suite
  cwd: .
  description: >-
    The real-browser consumer suite (examples/chat-demo, Playwright against
    Chromium and WebKit). scripts/consumer-app.sh builds and packs the
    library, installs the tarball into a temp copy of examples/chat-demo
    outside the repo tree, typechecks and vite-builds it, and runs the
    Playwright suite against vite preview - it exercises the packed tarball
    rather than the working tree. Needs Chromium and WebKit: the run itself
    executes "npx playwright install --with-deps chromium webkit" before the
    tests (on Linux --with-deps also installs OS packages); CI adds no
    install step of its own. This entry serves the interactive test-command
    interface (lore_run_test) only: lore-code-trace, run by
    .github/workflows/lore-tests.yml, honours only the first manifest entry,
    so that job never runs this suite and installs no browsers for it (issue
    216). The suite runs whole: a {selector} is accepted and ignored - the
    run command contains no placeholder, so nothing is interpolated, and the
    script takes no argument but --keep. No list command, since the suite is
    not addressable per-test through this interface, and no coverage_format,
    since the Playwright run against a preview build produces no coverage.
    Runs on every pull request as the "consumer" job in
    .github/workflows/ci.yml.
  run: npm run consumer
