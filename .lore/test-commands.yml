```yaml
list: npm test -- --listTests --json 2>/dev/null | jq '[.[] | {id: ., name: (. | split("/") | .[-1] | sub("\\.test\\.(ts|tsx|js)$"; "")), file: ., startLine: 1, endLine: null}]'
run: npm test -- --coverage --testNamePattern="{selector}" --no-coverage 2>&1 | tee /tmp/test-output.txt && node -e "const fs=require('fs');const coverage=JSON.parse(fs.readFileSync('coverage/coverage-final.json','utf8'));const selector=process.env.TEST_SELECTOR||'';const covered=Object.entries(coverage).filter(([file])=>file.includes(selector)).flatMap(([file,data])=>data.fnMap?Object.values(data.fnMap).map(fn=>({file,startLine:fn.loc.start.line,endLine:fn.loc.end.line})):[]);const passed=/PASS/.test(fs.readFileSync('/tmp/test-output.txt','utf8'));console.log(JSON.stringify({passed,covered}))"
coverage_format: json
```